<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cinemaAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cardFx" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="gridFx" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="450" rx="20" fill="url(#bgFx)"/>
  <rect width="1200" height="450" rx="20" fill="url(#gridFx)"/>
  <rect x="1" y="1" width="1198" height="448" rx="19" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Column -->
  <g transform="translate(52, 48)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="420" height="30" rx="15" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="18" cy="15" r="5" fill="#F59E0B"/>
    <text x="32" y="20" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="0.4">SONY CXD90057 AARCH64 · CLEAN-ROOM BYOF LAB</text>

    <!-- Title -->
    <text x="0" y="88" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">sony-fx3-fx6-lab</text>
    <text x="0" y="126" fill="url(#cinemaAmber)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="700">ILME-FX3 (7.02) &amp; ILME-FX6 (6.01) QEMU Emulation &amp; Firmware Porting Lab</text>
    <text x="0" y="156" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15.5" font-weight="500">索尼电影机 FX3 / FX6 跨机型系统移植、高保真 QEMU 虚拟机、Web 交互菜单与离线救砖工程实验室</text>

    <!-- 4 Track Cards -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="286" height="78" rx="12" fill="url(#cardFx)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="28" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800">TRACK 1 · FX6-on-FX3 Hybrid VM</text>
      <text x="16" y="48" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">FX6 appFw.so + GRM/UXEngine Closure</text>
      <text x="16" y="66" fill="#34D399" font-family="ui-monospace, monospace" font-size="11.5">✓ 180s Stable @ FX3_MEDIA_START</text>

      <rect x="302" y="0" width="286" height="78" rx="12" fill="url(#cardFx)" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
      <text x="318" y="28" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800">TRACK 2 · FX3 Interactive Web VM</text>
      <text x="318" y="48" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Apple Silicon MTTCG + Live OSD UI</text>
      <text x="318" y="66" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11.5">✓ r10 Deployed · r11–r48 Verified</text>

      <rect x="0" y="90" width="286" height="78" rx="12" fill="url(#cardFx)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="118" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800">TRACK 3 · Hardware &amp; eMMC Matrix</text>
      <text x="16" y="138" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">30 UDA Partitions &amp; Backup.bin Audit</text>
      <text x="16" y="156" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11.5">✓ Calibration Redlines Mapped</text>

      <rect x="302" y="90" width="286" height="78" rx="12" fill="url(#cardFx)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.6"/>
      <text x="318" y="118" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800">TRACK 4 · Recovery Adapter v0.5</text>
      <text x="318" y="138" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Bounded SquashFS &amp; USB Stage 1–286</text>
      <text x="318" y="156" fill="#FDE68A" font-family="ui-monospace, monospace" font-size="11.5">✓ 0 Bytes Proprietary Binary (BYOF)</text>
    </g>
  </g>

  <!-- Right Column: QEMU Telemetry Console -->
  <g transform="translate(672, 46)">
    <rect x="0" y="0" width="476" height="358" rx="14" fill="#070A0F" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="476" height="36" rx="14" fill="#1E293B"/>
    <rect x="0" y="20" width="476" height="16" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="40" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="6" fill="#10B981"/>
    <text x="238" y="22" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">QEMU CXD90057 · FX6-on-FX3 Telemetry</text>

    <g transform="translate(18, 56)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="0" y="0" fill="#F59E0B" font-weight="700">[0.000] Booting Linux 4.9.337-scel+ (CXD90057)</text>
      <text x="0" y="22" fill="#94A3B8">[0.412] High DDR mapped: 0x400000000 (5.0 GiB)</text>
      <text x="0" y="44" fill="#10B981">[1.108] cp_helper_agnostic: bound FX6 0x..2f70</text>
      <text x="0" y="66" fill="#10B981">[1.890] CAPID pre-init: 0x032d200d -&gt; 0x132d OK</text>
      <text x="0" y="88" fill="#38BDF8">[2.405] exec: /usr/bin/bootin -&gt; im.elf (FX6 6.01)</text>
      <text x="0" y="110" fill="#38BDF8">[3.120] dlopen: /usr/lib/appFw.so + libgrm.so</text>
      <text x="0" y="132" fill="#C084FC">[4.510] libuxengine + libstella + liblibra ready</text>
      <text x="0" y="154" fill="#10B981">[5.840] ENTER: FX3_MEDIA_START_BRANCH (Alive)</text>

      <line x1="0" y1="170" x2="440" y2="170" stroke="#1E293B" stroke-width="1.5"/>

      <text x="0" y="192" fill="#E2E8F0" font-weight="700">SUBSYSTEM                     STATUS</text>
      <text x="0" y="214" fill="#CBD5E1">FX3 Native Web Menu VM (r10)  <tspan fill="#34D399" font-weight="700">ONLINE (HTTP :8765)</tspan></text>
      <text x="0" y="234" fill="#CBD5E1">FX6-on-FX3 Hybrid Stack       <tspan fill="#34D399" font-weight="700">180s STABLE RUN</tspan></text>
      <text x="0" y="254" fill="#CBD5E1">Native Key Injection ACK      <tspan fill="#38BDF8" font-weight="700">MENU / UP / DOWN OK</tspan></text>

      <rect x="0" y="268" width="440" height="26" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="285" fill="#34D399" font-weight="700">19,572 Open-Source Files · 0 Proprietary Bytes</text>
    </g>
  </g>
</svg>
