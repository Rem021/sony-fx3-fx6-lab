name: Clean-Room Verification CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FX3_FX6_FORCE_CLEAN_ROOM: "1"

jobs:
  clean-room-verify:
    name: Clean-Room Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig 0.13.0 (freestanding AArch64 Tier-0 worker compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Install host C compiler & zsh on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zsh

      - name: Install optional Unicorn & Capstone AArch64 emulator packages
        run: |
          python3 -B -m pip install --upgrade pip
          python3 -B -m pip install unicorn capstone

      - name: Verify BYOF clean-room manifest schema & EN/ZH parity
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-byof

      - name: Run 7-suite donorless clean-room verification (12,043 tests across synthetic + Unicorn + POSIX sh)
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make test

      - name: Run Stage-B, Firmware-Lab (45 Auditors) & 52-Stage Co-Emulation CLI checks
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-peripheral-ux > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-ap-cp-imaging > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-stage-b-p10 > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-uipc-cp-shim > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-wireless-guard > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-firmware-lab > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-coemulation > /dev/null

      - name: Run Safety Preflights (up to 108-Gate), 45-Pillar Recovery, Post-Trial & Milestone 90..264 Master Gates
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-20-gates > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-24-gates > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-32-gates > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-40-gates > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety" "$(command -v python3)" -B -m fx3_safety verify-108-gates --force-clean-room --simulate-bench-dry-run > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety" "$(command -v python3)" -B -m fx3_safety verify-124-gates --force-clean-room --simulate-bench-dry-run > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety" "$(command -v python3)" -B -m fx3_safety verify-134-gates --force-clean-room --simulate-bench-dry-run > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-rp2040-fixture > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-init2-escape > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-tier0-backup > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-antirollback-guard > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-10pillar-recovery > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-13pillar-recovery > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-recovery-adapter" "$(command -v python3)" -B -m fx3_recovery verify-45pillar-recovery --clean-room > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-recovery-adapter" "$(command -v python3)" -B -m fx3_recovery verify-50pillar-recovery --clean-room > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-recovery-adapter" "$(command -v python3)" -B -m fx3_recovery verify-54pillar-recovery --clean-room > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-post-trial-audit > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-milestone-90 > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-milestone-110 > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-milestone-130 > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety:outputs/fx3-recovery-adapter:outputs/fx3-firmware-lab:outputs/fx3-vm:outputs/fx6-on-fx3-closure" "$(command -v python3)" -B -m fx6_closure verify-milestone-264 --force-clean-room > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety:outputs/fx3-recovery-adapter:outputs/fx3-firmware-lab:outputs/fx3-vm:outputs/fx6-on-fx3-closure" "$(command -v python3)" -B -m fx6_closure verify-milestone-295 --force-clean-room > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHONPATH="outputs/fx3-safety:outputs/fx3-recovery-adapter:outputs/fx3-firmware-lab:outputs/fx3-vm:outputs/fx6-on-fx3-closure" "$(command -v python3)" -B -m fx6_closure verify-milestone-311 --force-clean-room > /dev/null

      - name: Run Stage-A & Stage-B H0->H1->H2 zero-mutation lifecycle drills
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make lifecycle-drill > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make stage-b-lifecycle-drill > /dev/null

      - name: Audit zero .pyc / __pycache__ / clean-room hygiene
        run: |
          PYTHON="$(command -v python3)" make clean-audit
