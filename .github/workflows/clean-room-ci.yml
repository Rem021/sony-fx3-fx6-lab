name: Clean-Room Verification CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FX3_FX6_FORCE_CLEAN_ROOM: "1"

jobs:
  clean-room-verify:
    name: Clean-Room Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig 0.13.0 (freestanding AArch64 Tier-0 worker compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Install host C compiler & zsh on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zsh

      - name: Install optional Unicorn & Capstone AArch64 emulator packages
        run: |
          python3 -B -m pip install --upgrade pip
          python3 -B -m pip install unicorn capstone

      - name: Verify BYOF clean-room manifest schema & EN/ZH parity
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-byof

      - name: Run 7-suite donorless clean-room verification (synthetic + Unicorn + POSIX sh)
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make test

      - name: Run Phase 17..70 Stage-B, Firmware-Lab (13 Auditors) & 9-Stage Co-Emulation CLI checks
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-peripheral-ux > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-ap-cp-imaging > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-stage-b-p10 > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-uipc-cp-shim > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-wireless-guard > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-firmware-lab > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-coemulation > /dev/null

      - name: Run Phase 59..69 20-Gate Safety Preflight, RP2040 Fixture, init2 Escape & Post-Trial Forensic Gates
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-20-gates > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-rp2040-fixture > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-init2-escape > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make verify-post-trial-audit > /dev/null

      - name: Run Stage-A & Stage-B H0->H1->H2 zero-mutation lifecycle drills
        run: |
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make lifecycle-drill > /dev/null
          FX3_FX6_FORCE_CLEAN_ROOM=1 PYTHON="$(command -v python3)" make stage-b-lifecycle-drill > /dev/null

      - name: Audit zero .pyc / __pycache__ / clean-room hygiene
        run: |
          PYTHON="$(command -v python3)" make clean-audit
